# BC5 input configuration for the KytyPlus host (patch 0001).
#
# Load it with  --input-config <file>  or  KYTY_BC5_INPUT_CONFIG=<file>.
# One statement per line; `#` starts a comment. A later line replaces an earlier one that uses
# the same control or the same input. Every line is also accepted as a --keymap argument.
#
# Three kinds of line:
#
#   <Control>=<Input>       the control is driven by this host input, on top of what the pad's
#                           own button for it does (unless that is disabled below)
#   Pad:<name>=none         the physical pad's button or axis never reaches the game
#   DefaultKeys=on|off      the built-in keyboard layout (default on); a key or a control that a
#                           line above binds leaves the layout, "<Control>=none" drops its key
#
# Controls:
#   Cross Circle Square Triangle  L1 R1 L2 R2 L3 R3  Up Down Left Right  Options TouchPad
#   LeftStickLeft LeftStickRight LeftStickUp LeftStickDown
#   RightStickLeft RightStickRight RightStickUp RightStickDown
#
# Inputs:
#   a key, as SDL names it:  M   O   Right Shift   Keypad 0   Page Up   F5   (Escape, Space and F1
#                            are the host's: quit, pause, RenderDoc)
#   Mouse:Left  Mouse:Middle  Mouse:Right  Mouse:X1  Mouse:X2
#   Pad:<button>  with SDL's names: a b x y back guide start leftstick rightstick leftshoulder
#                 rightshoulder dpup dpdown dpleft dpright misc1 paddle1 paddle2 paddle3 paddle4
#                 touchpad          (on a DualSense: a = Cross, b = Circle, x = Square, y = Triangle)
#   Pad:<axis>    lefttrigger righttrigger (pressed past half travel), and leftx lefty rightx righty
#                 with a direction: Pad:leftx-  Pad:leftx+  Pad:lefty-  Pad:lefty+ ...
#
# The built-in keyboard layout (DefaultKeys=on):
#   arrows = D-pad      J = Cross  I = Triangle  K = Square  L = Circle
#   Q = L1  E = R1  U = L2  O = R2  Left Shift = L3  Left Ctrl = R3
#   Enter = Options  Backspace or Tab = TouchPad
#   W A S D = left stick   T F G H = right stick
#
# Examples (uncomment what you need):

# A pad whose R2 is stuck at full travel: ignore it, and press R2 from the keyboard instead.
#Pad:righttrigger=none
#R2=O

# The same, but with the pad's L1 standing in for R2 (and L1 itself off).
#Pad:righttrigger=none
#Pad:leftshoulder=none
#R2=Pad:leftshoulder

# Swap Cross and Circle on the pad.
#Pad:a=none
#Pad:b=none
#Cross=Pad:b
#Circle=Pad:a

# Jump with the mouse.
#Cross=Mouse:Left

# Keyboard only, custom layout, nothing from the built-in one.
#DefaultKeys=off
#Cross=Space      # not allowed: Space pauses the host; pick another key
#Cross=N
#Circle=M
#LeftStickUp=W
#LeftStickDown=S
#LeftStickLeft=A
#LeftStickRight=D
