[workspace]
resolver = "2"
members = ["bc5-mount", "bc5-agc"]

[workspace.package]
edition = "2021"
license = "GPL-2.0-only"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1"
# clap without `color`/`suggestions`: they pull windows-sys (raw-dylib), which
# needs dlltool on the windows-gnu toolchain.
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
thiserror = "2"
# Approved 2026-09-29 for the Mesa register JSON (bc5-agc); pure Rust, no network.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# proptest without `fork`/`timeout` for the same reason; its `alloc` build
# forgets to ask num-traits for `std`, so that is unified explicitly.
proptest = { version = "1", default-features = false, features = ["alloc"] }
num-traits = { version = "0.2", features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Parsers index into byte buffers with checked offsets; these are noise there.
cast_possible_truncation = "allow"
module_name_repetitions = "allow"
# Errors are documented once per module (every fallible call returns crate::Error).
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
