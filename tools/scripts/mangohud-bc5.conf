# BC5: MangoHud overlay for the emulator (2026-10-21, asked by the maintainer for recordings).
# Used when a launcher runs with BC5_MANGOHUD=1 (play-pkg.sh, play-astro.sh, the "BC5 emulator
# (MangoHud)" desktop shortcut); the box keeps a copy at ~/bc5-work/mangohud-bc5.conf. Its own file,
# not ~/.config/MangoHud/MangoHud.conf, so that Steam games keep their own overlay settings.
#
# MangoHud counts the window's presents, and the emulator presents its window at every vblank (~60 a
# second) whatever the title's frame rate; so MangoHud's fps and frame time are left out here, and the
# title's own frame rate comes from the emulator's counter in the top-right corner (KYTY_BC5_OSD_FPS=1,
# which BC5_MANGOHUD=1 sets too). MangoHud's keys need X11 and do not reach it from the container.
# The emulator's keys are F1 (menu), F2 (settings) and F11 (fullscreen): MangoHud's defaults on
# Shift+F1 / Shift+F2 are moved away from them.
# BC-250 caveat: the GPU clock MangoHud reads from amdgpu's gpu_metrics is not reliable on this board
# (100 MHz on the start screen and 40 MHz in the night scene at 92 % load, 2026-10-21; ~1067 MHz at full
# speed in experiments 0178-0179), so it is left out; load, temperatures and power are fine.

legacy_layout=false
position=top-left
font_size=20
background_alpha=0.45
round_corners=6
fps_sampling_period=500

# CPU (Zen 2, 8 cores / 16 threads after the unlock)
cpu_stats
cpu_temp
cpu_mhz
cpu_power

# GPU (gfx1013)
gpu_name
gpu_stats
gpu_temp
gpu_power
vram

# system
ram
resolution
time

# keys (X11 only; inactive in the ubuntu container on the Wayland desktop)
toggle_hud=Shift_R+F12
toggle_logging=Shift_L+F10
toggle_fps_limit=Shift_L+F9
reload_cfg=Shift_L+F4

# logging: autostart_log=1 (with log_duration=<s>) in a copy of this file writes a CSV from the start
output_folder=/home/kjaniszewski/bc5-work/mangohud-logs
log_interval=100
