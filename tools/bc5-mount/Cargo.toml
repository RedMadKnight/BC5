[package]
name = "bc5-mount"
version = "0.1.0"
description = "Read-only access to .ffpfsc containers (PFS v2 -> PFSC -> exFAT), FUSE mount and fixtures"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "bc5-mount"
path = "src/main.rs"

[[bin]]
name = "bc5-fixture"
path = "src/bin/bc5-fixture.rs"

[features]
# The FUSE mount is Linux-only; every other subcommand, the readers and the
# fixture generator build everywhere. `fuse` is a no-op on other platforms.
default = ["fuse"]
fuse = ["dep:fuser"]

# clap without `color`/`suggestions` and proptest without `fork`/`timeout`: both
# would pull windows-sys (raw-dylib), which needs dlltool on the windows-gnu
# toolchain. Neither feature is needed here.
[dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
flate2 = "1"
sha2 = "0.10"
thiserror = "2"

# PS5 package (FPKG) support: the inner image is Oodle Kraken compressed; oozextract (MIT,
# pure Rust, vendored in ../third_party with the "excess" length-stream framing added, which
# the PS5 blocks use and upstream 0.5.5 rejects; see third_party/oozextract/README-bc5.md).
oozextract = { path = "../third_party/oozextract", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Without the `libfuse` feature fuser mounts through the fusermount3 binary and
# needs no libfuse development headers at build time (only `fuse3` at run time).
fuser = { version = "0.15", optional = true, default-features = false }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["alloc"] }
# proptest's `alloc` build forgets to ask num-traits for `std`; unify it here.
num-traits = { version = "0.2", features = ["std"] }

[lints]
workspace = true
